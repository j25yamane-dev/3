<html lang="ja">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans JP', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .coin-display {
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        .coin-label {
            color: #666;
            font-size: 0.8em;
            display: block;
            margin-bottom: 5px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .courses {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        .course-btn {
            padding: 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .course-btn:hover {
            transform: scale(1.05);
        }
        .course-btn:active {
            transform: scale(0.95);
        }
        .course-info {
            font-size: 0.9em;
            margin-top: 5px;
        }
        .pachinko-section {
            text-align: center;
            padding: 30px;
            background: #fff3cd;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .pachinko-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .pachinko-btn:hover {
            transform: scale(1.05);
        }
        .pachinko-btn:active {
            transform: scale(0.95);
        }
        .word-display {
            font-size: 2.5em;
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            font-weight: bold;
            color: #333;
            word-wrap: break-word;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area {
            margin: 20px 0;
        }
        .input-area input {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: 'Noto Sans JP', Arial, sans-serif;
        }
        .input-area input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }
        .progress {
            text-align: center;
            font-size: 1.2em;
            margin: 20px 0;
            color: #666;
        }
        .timer {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }
        .timer.warning {
            color: #dc3545;
        }
        .time-bar {
            width: 100%;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }
        .time-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.1s linear;
        }
        .result-screen {
            text-align: center;
        }
        .result-title {
            font-size: 2em;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }
        .result-coins {
            font-size: 2.5em;
            font-weight: bold;
            color: #ffd700;
            margin: 20px 0;
        }
        .result-stats {
            font-size: 1.2em;
            color: #666;
            margin: 10px 0;
        }
        .back-btn {
            padding: 10px 20px;
            background: #666;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
        }
        .back-btn:hover {
            background: #555;
        }
        .pachinko-machine {
            font-size: 5em;
            margin: 40px 0;
        }
        .pachinko-result {
            font-size: 2em;
            font-weight: bold;
            margin: 20px 0;
        }
        .error {
            color: red;
            font-weight: bold;
            margin: 10px 0;
        }
        @media (max-width: 600px) {
            .courses {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8em;
            }
            .word-display {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ホーム画面 -->
        <div id="homeScreen" class="screen active">
            <h1>🎮 タイピングコイン</h1>
            <p class="subtitle">文章を入力してコインを稼ぐ</p>
            
            <div class="coin-display">
                <span class="coin-label">保有コイン</span>
                <span id="coinDisplay">0</span>
            </div>

            <h2 style="text-align: center; margin-bottom: 20px;">📝 タイピングゲーム</h2>
            <div class="courses">
                <button class="course-btn" onclick="startGame(20)">
                    20文章<br>
                    <span class="course-info">報酬: 10コイン</span>
                </button>
                <button class="course-btn" onclick="startGame(60)">
                    60文章<br>
                    <span class="course-info">報酬: 50コイン</span>
                </button>
                <button class="course-btn" onclick="startGame(240)">
                    240文章<br>
                    <span class="course-info">報酬: 300コイン</span>
                </button>
            </div>

            <div class="pachinko-section">
                <h2 style="margin-bottom: 15px;">🎰 パチンコ</h2>
                <p>稼いだコインでパチンコをプレイ！大当たりで大量のコインをゲット！</p>
                <p style="font-size: 1.3em; font-weight: bold; margin: 15px 0;">1回 100コイン</p>
                <button class="pachinko-btn" onclick="startPachinko()">パチンコをプレイ</button>
                <div id="pachinkoError" class="error" style="display: none;"></div>
            </div>
        </div>

        <!-- ゲーム画面 -->
        <div id="gameScreen" class="screen">
            <button class="back-btn" onclick="goHome()">← ホームに戻る</button>
            
            <div class="progress">
                <span id="currentWord">1</span> / <span id="totalWords">20</span>
            </div>

            <div class="timer" id="timer">時間: 0秒</div>
            <div class="time-bar">
                <div class="time-bar-fill" id="timeBarFill"></div>
            </div>

            <div class="word-display" id="wordDisplay">文章が表示されます</div>

            <div class="input-area">
                <input type="text" id="gameInput" placeholder="ここに入力してください" autofocus>
            </div>

            <div id="gameMessage" style="text-align: center; color: #666; margin: 20px 0;"></div>
        </div>

        <!-- パチンコ画面 -->
        <div id="pachinkoScreen" class="screen">
            <button class="back-btn" onclick="goHome()">← ホームに戻る</button>
            
            <h2 style="text-align: center; margin: 30px 0;">🎰 パチンコ</h2>
            <div class="pachinko-machine" id="pachinkoMachine">🎰</div>
            <div class="pachinko-result" id="pachinkoResult"></div>
            <div style="text-align: center; margin: 30px 0;">
                <button class="pachinko-btn" onclick="playPachinko()">もう一度プレイ</button>
                <button class="back-btn" style="margin-left: 10px;" onclick="goHome()">ホームに戻る</button>
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="resultScreen" class="screen">
            <div class="result-screen">
                <div class="result-title" id="resultTitle">ゲーム終了</div>
                <div class="result-coins" id="resultCoins">+0コイン</div>
                <div class="result-stats" id="resultStats">統計情報</div>
                <button class="back-btn" onclick="goHome()">ホームに戻る</button>
            </div>
        </div>
    </div>
